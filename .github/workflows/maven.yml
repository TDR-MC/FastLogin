# Automatically build, run unit and integration tests to detect errors early (CI provided by GitHub)
# including making pull requests review easier

# Human-readable name in the actions tab
name: Maven Build

# Build on every pull request regardless of the branch
# Wiki: https://help.github.com/en/actions/reference/events-that-trigger-workflows
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  # job id
  build_and_test:

    # Environment image - always use the newest OS
    runs-on: ubuntu-latest
    permissions:
      # With at least one permission given, all default to read
      contents: read

    # Run steps
    steps:
      # Pull changes
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Setup Java
      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version-file: '.java-version'
          cache: 'maven'

      - name: Resolve dependency graph
        run: |
          mvn dependency:tree -DoutputFile=target/dependency-tree.txt --batch-mode --no-snapshot-updates --strict-checksums --file pom.xml
          mvn test -DskipTests --batch-mode --no-snapshot-updates --strict-checksums --file pom.xml

      - name: Verify locked build inputs
        run: python3 scripts/verify-build-inputs.py

      # Build and test (included in package)
      - name: Build with Maven and test
        # Run non-interactive, package (with compile+test),
        # ignore snapshot updates, because they are likely to have breaking changes, enforce checksums
        run: mvn package --batch-mode --no-snapshot-updates --strict-checksums --file pom.xml

  dependency:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      # Write only necessary for dependency submission all others then default to read
      contents: write

    # Run steps
    steps:
      # Pull changes
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Setup Java
      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version-file: '.java-version'
          cache: 'maven'

      - name: Resolve dependency graph
        run: |
          mvn dependency:tree -DoutputFile=target/dependency-tree.txt --batch-mode --no-snapshot-updates --strict-checksums --file pom.xml
          mvn test -DskipTests --batch-mode --no-snapshot-updates --strict-checksums --file pom.xml

      - name: Verify locked build inputs
        run: python3 scripts/verify-build-inputs.py

      - name: Submit Dependency Snapshot
        uses: advanced-security/maven-dependency-submission-action@b275d12641ac2d2108b2cbb7598b154ad2f2cee8 # v5.0.0
        with:
          maven-args: --no-snapshot-updates --strict-checksums
