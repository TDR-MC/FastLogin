# GitHub automatic code security scanning using CodeQL

# Human-readable name in the actions tab
name: "CodeQL"

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  # job i
  analyze:

    # Display name
    name: Analyze

    # Environment
    runs-on: ubuntu-latest

    timeout-minutes: ${{ (matrix.language == 'swift' && 120) || 360 }}

    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: true
      matrix:
        # Languages to scan
        language: [ 'java' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3
        with:
          languages: ${{ matrix.language }}

      # Setup Java
      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version-file: '.java-version'
          cache: 'maven'

      - name: Resolve dependency graph
        run: mvn dependency:tree -DoutputFile=target/dependency-tree.txt --batch-mode --no-snapshot-updates --strict-checksums --file pom.xml

      - name: Verify locked build inputs
        run: python3 scripts/verify-build-inputs.py --resolve

      # Manually start the autobuild process, because autobuild always selects Java 8 as build toolchain, but
      # we are doing cross-crompiling from a newer Java version
      - name: Build with Maven
        # Extracted from autobuild
        run: mvn package -f "pom.xml" --batch-mode --no-snapshot-updates --strict-checksums -V -e -Dfindbugs.skip -Dcheckstyle.skip -Dpmd.skip=true -Dspotbugs.skip -Denforcer.skip -Dmaven.javadoc.skip -DskipTests -Dmaven.test.skip.exec -Dlicense.skip=true -Drat.skip=true -Dspotless.check.skip=true -t /home/runner/.m2/toolchains.xml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3
        with:
          category: "/language:${{matrix.language}}"
